<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>List a Job | ServiceHub</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ========================================
         NAVBAR
    ======================================== -->
    <header class="navbar">
        <a href="index.html" class="logo">
            <span class="logo-mark">ϟ</span>
            <span>ServiceHub</span>
        </a>

        <div id="mobile-nav-panel" class="nav-panel">
            <nav class="nav-links">
                <a href="explore.html">Explore</a>
                <a href="index.html#categories">Categories</a>
                <a href="how-it-works.html">How It Works</a>
            </nav>

            <div class="nav-actions">
                <a class="login-btn" href="list-service.html">List a Service</a>
                <a class="list-btn" href="list-service.html">List Your Service</a>
            </div>
        </div>

        <button class="menu-btn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="mobile-nav-panel">☰</button>
    </header>

    <!-- ========================================
         LIST A JOB PAGE
    ======================================== -->

    <main class="service-page login-page job-page">

        <button type="button" class="how-back-btn" onclick="history.back()">
            ← Back
        </button>

        <section class="service-header">

            <span class="service-category">
                SERVICEHUB JOB BOARD
            </span>

            <h1>List a Job</h1>

            <p>
                Tell people what you need and give qualified professionals
                the information they need to get in touch.
            </p>

        </section>

        <!-- ========================================
             JOB FORM
        ======================================== -->

        <section class="service-details">

            <div class="login-card job-card">

                <form id="jobListingForm">

                    <!-- 1. NAME -->
                    <div class="form-group">
                        <label for="jobName">Name</label>
                        <input
                            type="text"
                            id="jobName"
                            name="name"
                            placeholder="Enter your name"
                            maxlength="80"
                            autocomplete="name"
                            required
                        >
                    </div>

                    <!-- 2. COMPANY -->
                    <div class="form-group">
                        <label for="jobCompany">
                            Company
                            <span class="optional">(Optional)</span>
                        </label>
                        <input
                            type="text"
                            id="jobCompany"
                            name="company"
                            placeholder="Enter your company name"
                            maxlength="100"
                            autocomplete="organization"
                        >
                    </div>

                    <!-- 3. JOB TYPE -->
                    <div class="form-group">
                        <label for="jobType">Job Type</label>
                        <select id="jobType" name="jobType" required>
                            <option value="">Choose a job type</option>
                            <option value="remote">Remote</option>
                            <option value="onetime">One-time</option>
                            <option value="contract">Contract</option>
                            <option value="part-time">Part-time</option>
                            <option value="fulltime">Full-time</option>
                            <option value="others">Others</option>
                        </select>
                    </div>

                    <div id="otherJobTypeBox" class="form-group conditional-job-field" hidden>
                        <label for="otherJobType">Specify Job Type</label>
                        <input
                            type="text"
                            id="otherJobType"
                            name="otherJobType"
                            placeholder="Enter your specific job type"
                            maxlength="80"
                        >
                    </div>

                    <!-- 4. QUALIFICATIONS / REQUIREMENTS -->
                    <div class="form-group">
                        <label for="jobRequirements">Expected Qualifications / Requirements</label>
                        <textarea
                            id="jobRequirements"
                            name="requirements"
                            rows="6"
                            maxlength="3000"
                            placeholder="Describe the qualifications, experience, skills, or requirements you expect..."
                            required
                        ></textarea>
                    </div>

                    <!-- 5. PAYMENT OFFER -->
                    <div class="form-group">
                        <label for="paymentCurrency">Payment Offer</label>

                        <select id="paymentCurrency" name="currency" required>
                            <option value="">Choose currency</option>
                            <option value="USD">Dollar ($)</option>
                            <option value="NGN">Naira (₦)</option>
                        </select>

                        <div id="paymentAmountBox" class="payment-input" hidden>
                            <span id="paymentCurrencySymbol" class="currency-prefix" aria-hidden="true">$</span>
                            <input
                                type="number"
                                id="paymentAmount"
                                name="paymentOffer"
                                min="0"
                                step="0.01"
                                inputmode="decimal"
                                placeholder="Enter payment amount"
                                aria-label="Payment amount"
                            >
                        </div>
                    </div>

                    <!-- 6. CONTACT -->
                    <div class="form-group">
                        <label for="jobContact">Contact Info</label>
                        <input
                            type="text"
                            id="jobContact"
                            name="contact"
                            placeholder="Email, phone, or other contact information"
                            maxlength="150"
                            required
                        >
                    </div>

                    <!-- 7. WHATSAPP -->
                    <div class="form-group">
                        <label for="jobWhatsapp">
                            WhatsApp
                            <span class="optional">(Optional)</span>
                        </label>
                        <input
                            type="tel"
                            id="jobWhatsapp"
                            name="whatsapp"
                            placeholder="WhatsApp number"
                            maxlength="40"
                            inputmode="tel"
                        >
                    </div>

                    <!-- 8. MEDIA (REQUIRED) -->
                    <div class="form-group job-media-group">
                        <label for="jobMedia">Media / Job Attachment</label>
                        <input
                            type="file"
                            id="jobMedia"
                            name="media"
                            accept="image/*,video/*,.pdf"
                            multiple
                            required
                        >
                        <small>Upload at least one image, video, or PDF related to the job.</small>
                        <div id="jobMediaPreview" class="job-media-preview" aria-live="polite"></div>
                    </div>

                    <!-- 9. TELEGRAM -->
                    <div class="form-group">
                        <label for="jobTelegram">
                            Telegram
                            <span class="optional">(Optional)</span>
                        </label>
                        <input
                            type="text"
                            id="jobTelegram"
                            name="telegram"
                            placeholder="@username or Telegram contact"
                            maxlength="100"
                        >
                    </div>

                    <p id="jobListingMessage" class="form-message" aria-live="polite"></p>

                    <button
                        type="submit"
                        class="contact-provider-btn login-submit listing-submit"
                    >
                        Continue →
                    </button>

                </form>

            </div>

            <a href="index.html" class="back-to-services">
                ← Back to Home
            </a>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
