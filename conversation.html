<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ServiceHub — Provider</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #080b12;
            color: #f3f6fa;
            font-family: Arial, sans-serif;
        }

        .provider-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 18px 20px;
            background: #101522;
            border-bottom: 1px solid #20283a;
        }

        .header h1 {
            margin: 0;
            font-size: 20px;
        }

        .provider-name {
            margin-top: 5px;
            color: #8993a6;
            font-size: 13px;
        }

        .status {
            margin-top: 10px;
            font-size: 13px;
        }

        .status.connected {
            color: #48e28a;
        }

        .status.error {
            color: #ff6262;
        }

        .conversations {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
        }

        .empty {
            text-align: center;
            color: #8993a6;
            margin-top: 60px;
        }

        .conversation {
            background: #101522;
            border: 1px solid #20283a;
            border-radius: 14px;
            padding: 15px;
            margin-bottom: 12px;
        }

        .conversation-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .customer {
            font-weight: bold;
        }

        .service {
            color: #8993a6;
            font-size: 12px;
            margin-top: 3px;
        }

        .time {
            color: #687386;
            font-size: 11px;
        }

        .message {
            background: #151c2b;
            border-radius: 10px;
            padding: 10px;
            margin: 8px 0;
            font-size: 14px;
        }

        .message-name {
            color: #2388ff;
            font-size: 11px;
            margin-bottom: 4px;
        }

        .reply-box {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .reply-box input {
            flex: 1;
            min-width: 0;
            background: #080b12;
            border: 1px solid #30394d;
            border-radius: 9px;
            padding: 11px;
            color: white;
            outline: none;
        }

        .reply-box button {
            border: 0;
            border-radius: 9px;
            padding: 0 15px;
            background: #2388ff;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .reply-box button:active {
            transform: scale(.97);
        }
    </style>
</head>

<body>

<div class="provider-page">

    <header class="header">
        <h1>ServiceHub Provider</h1>

        <div class="provider-name">
            Signed in as: <strong>Solaceproeditz</strong>
        </div>

        <div id="status" class="status">
            Connecting...
        </div>
    </header>

  <main class="provider-layout">

    <!-- CHAT LIST -->
    <aside class="chat-list" id="chatList">

        <div class="chat-list-title">
            Chats
        </div>

        <div class="empty" id="emptyState">
            No conversations yet.
        </div>

    </aside>


    <!-- ACTIVE CHAT -->
    <section class="chat-window" id="chatWindow">

        <div class="chat-placeholder" id="chatPlaceholder">
            <div class="placeholder-icon">💬</div>
            <div>Select a conversation to start chatting</div>
        </div>

    </section>

</main>

</div>


<script>
/* ========================================
   SUPABASE CONFIG
======================================== */

const SUPABASE_URL =
    "https://qqnvnceoipxyxkqsubsv.supabase.co";

const SUPABASE_ANON_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFxbnZuY2VvaXB4eXhrcXN1YnN2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1ODg2NzMsImV4cCI6MjEwNTE2NDY3M30.a_6wsmD3fH2Dv_-Wd47DMQlfeTBRsP7XoDAOdXthUns";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* ========================================
   PROVIDER ACCOUNT
======================================== */

const providerAccount =
    JSON.parse(
        localStorage.getItem("serviceHubLogin") || "null"
    );


const PROVIDER_ID =
    providerAccount?.Contact ||
    providerAccount?.["Contact Information"] ||
    providerAccount?.Name ||
    "";


const PROVIDER_NAME =
    providerAccount?.Name ||
    "Service Provider";


/* ========================================
   PROVIDER CHAT ELEMENTS
======================================== */

const chatList =
    document.getElementById("chatList");

const emptyState =
    document.getElementById("emptyState");

const chatWindow =
    document.getElementById("chatWindow");

const chatPlaceholder =
    document.getElementById("chatPlaceholder");

const statusElement =
    document.getElementById("status");
    /* ========================================
       CONNECTION STATUS
    ======================================== */

    function setStatus(message, connected) {

        statusElement.textContent = message;

        statusElement.className =
            connected
                ? "status connected"
                : "status error";
    }


  /* ========================================
   LOAD EXISTING CONVERSATIONS
======================================== */

async function loadConversations() {

    const { data, error } =
        await supabaseClient
            .from("conversations")
            .select("*")
            .eq("provider_id", PROVIDER_ID)
            .order("updated_at", {
                ascending: false
            });


    if (error) {

        console.error(error);

        setStatus(
            "Database error: " + error.message,
            false
        );

        return;
    }


    chatList.innerHTML = "";


    if (!data || data.length === 0) {

        chatList.appendChild(
            emptyState
        );

        return;
    }


    for (const conversation of data) {

        await renderConversation(
            conversation
        );
    }
}
/* ========================================
   RENDER CONVERSATION IN CHAT LIST
======================================== */

async function renderConversation(conversation) {

    const item =
        document.createElement("div");

    item.className =
        "chat-item";

    item.dataset.id =
        conversation.id;


    /* ---------- HEADER ---------- */

    const header =
        document.createElement("div");

    header.className =
        "chat-item-header";


    /* ---------- CUSTOMER NAME ---------- */

    const customer =
        document.createElement("div");

    customer.className =
        "chat-item-name";

    customer.textContent =
        conversation.customer_name ||
        "Customer";


    /* ---------- TIME ---------- */

    const time =
        document.createElement("div");

    time.className =
        "chat-item-time";

    time.textContent =
        conversation.updated_at
            ? new Date(
                conversation.updated_at
              ).toLocaleTimeString()
            : "";


    header.appendChild(customer);
    header.appendChild(time);


    /* ---------- SERVICE ---------- */

    const service =
        document.createElement("div");

    service.className =
        "chat-item-service";

    service.textContent =
        conversation.service_name || "";


    /* ---------- MESSAGE PREVIEW ---------- */

    const preview =
        document.createElement("div");

    preview.className =
        "chat-item-preview";

    preview.textContent =
        "Open conversation";


    /* ---------- BUILD CHAT ITEM ---------- */

    item.appendChild(header);

    item.appendChild(service);

    item.appendChild(preview);


    /* ---------- OPEN CHAT ---------- */

    item.addEventListener(
        "click",
        function () {

            document
                .querySelectorAll(".chat-item")
                .forEach(function (chat) {

                    chat.classList.remove(
                        "active"
                    );

                });


            item.classList.add(
                "active"
            );


            openProviderConversation(
                conversation
            );
        }
    );


    chatList.appendChild(item);
}
/* ========================================
   OPEN PROVIDER CONVERSATION
======================================== */

async function openProviderConversation(
    conversation
) {

    /* ---------- CLEAR CHAT WINDOW ---------- */

    chatWindow.innerHTML = "";


    /* ---------- CHAT HEADER ---------- */

    const header =
        document.createElement("div");

    header.className =
        "active-chat-header";


    const customer =
        document.createElement("div");

    customer.className =
        "active-chat-customer";

    customer.textContent =
        conversation.customer_name ||
        "Customer";


    const service =
        document.createElement("div");

    service.className =
        "active-chat-service";

    service.textContent =
        conversation.service_name || "";


    header.appendChild(customer);

    header.appendChild(service);


    /* ---------- MESSAGES ---------- */

    const messages =
        document.createElement("div");

    messages.className =
        "active-messages";


    /* ---------- REPLY AREA ---------- */

    const replyBox =
        document.createElement("div");

    replyBox.className =
        "active-reply-box";


    const input =
        document.createElement("input");

    input.type =
        "text";

    input.placeholder =
        "Reply to customer...";


    const button =
        document.createElement("button");

    button.textContent =
        "Send";


    button.addEventListener(
        "click",
        function () {

            sendReply(
                conversation,
                input
            );
        }
    );


    input.addEventListener(
        "keydown",
        function (event) {

            if (event.key === "Enter") {

                sendReply(
                    conversation,
                    input
                );
            }
        }
    );


    replyBox.appendChild(input);

    replyBox.appendChild(button);


    /* ---------- BUILD CHAT WINDOW ---------- */

    chatWindow.appendChild(
        header
    );

    chatWindow.appendChild(
        messages
    );

    chatWindow.appendChild(
        replyBox
    );


    /* ---------- LOAD MESSAGES ---------- */

    await loadMessages(
        conversation.id,
        messages
    );
}
/* ========================================
   LOAD MESSAGES
======================================== */

async function loadMessages(
    conversationId,
    container
) {

    const { data, error } =
        await supabaseClient
            .from("messages")
            .select("*")
            .eq(
                "conversation_id",
                conversationId
            )
            .order("created_at", {
                ascending: true
            });


    if (error) {

        console.error(error);

        container.innerHTML =
            "<div>Could not load messages.</div>";

        return;
    }


    container.innerHTML = "";


    if (!data || data.length === 0) {

        container.innerHTML =
            "<div>No messages yet.</div>";

        return;
    }


    data.forEach(function (message) {

        addMessageToContainer(
            message,
            container
        );

    });


    /* ---------- SCROLL TO BOTTOM ---------- */

    container.scrollTop =
        container.scrollHeight;
}
/* ========================================
   ADD MESSAGE TO SCREEN
======================================== */

function addMessageToContainer(
    message,
    container
) {

    const messageElement =
        document.createElement("div");


    /* ---------- MESSAGE TYPE ---------- */

    if (
        message.sender_type === "provider"
    ) {

        messageElement.className =
            "provider-message";

    } else {

        messageElement.className =
            "customer-message";
    }


    /* ---------- MESSAGE TEXT ---------- */

    const text =
        document.createElement("div");

    text.textContent =
        message.message || "";


    /* ---------- SENDER NAME ---------- */

    const name =
        document.createElement("div");

    name.className =
        "message-name";

    name.textContent =
        message.sender_name ||
        "Unknown";


    /* ---------- BUILD MESSAGE ---------- */

    messageElement.appendChild(
        name
    );

    messageElement.appendChild(
        text
    );


    container.appendChild(
        messageElement
    );


    /* ---------- KEEP LATEST MESSAGE VISIBLE ---------- */

    container.scrollTop =
        container.scrollHeight;
}

    /* ========================================
       SEND PROVIDER REPLY
    ======================================== */

    async function sendReply(
        conversation,
        input
    ) {

        const message =
            input.value.trim();


        if (!message) {
            return;
        }


        input.disabled = true;


        const { error } =
            await supabaseClient
                .from("messages")
                .insert({

                    conversation_id:
                        conversation.id,

                    sender_type:
                        "provider",

                    sender_name:
                        PROVIDER_NAME,

                    message:
                        message
                });


        input.disabled = false;


        if (error) {

            console.error(error);

            alert(
                "Could not send message:\n" +
                error.message
            );

            return;
        }


        input.value = "";
    }


  /* ========================================
   REALTIME
======================================== */

function startRealtime() {

    const channel =
        supabaseClient
            .channel(
                "provider-messages-" +
                PROVIDER_ID
            )
            .on(
                "postgres_changes",
                {
                    event: "INSERT",
                    schema: "public",
                    table: "messages"
                },
                async function (payload) {

                    console.log(
                        "New message:",
                        payload.new
                    );


                    const message =
                        payload.new;


                    /* ---------- FIND CONVERSATION ---------- */

                    const { data: conversation } =
                        await supabaseClient
                            .from("conversations")
                            .select("*")
                            .eq(
                                "id",
                                message.conversation_id
                            )
                            .eq(
                                "provider_id",
                                PROVIDER_ID
                            )
                            .maybeSingle();


                    if (!conversation) {
                        return;
                    }


                    /* ---------- CHECK ACTIVE CHAT ---------- */

                    const activeMessages =
                        document.querySelector(
                            ".active-messages"
                        );


                    const activeChat =
                        document.querySelector(
                            ".chat-item.active"
                        );


                    if (
                        activeChat &&
                        activeChat.dataset.id ===
                            String(conversation.id)
                    ) {

                        addMessageToContainer(
                            message,
                            activeMessages
                        );

                        return;
                    }


                    /* ---------- NEW / OTHER CONVERSATION ---------- */

                    const existing =
                        document.querySelector(
                            `[data-id="${conversation.id}"]`
                        );


                    if (!existing) {

                        await renderConversation(
                            conversation
                        );
                    }
                }
            )
            .subscribe(function (status) {

                console.log(
                    "Realtime status:",
                    status
                );


                if (
                    status === "SUBSCRIBED"
                ) {

                    setStatus(
                        "● Connected to ServiceHub",
                        true
                    );


                } else if (
                    status === "CHANNEL_ERROR"
                ) {

                    setStatus(
                        "Realtime connection error",
                        false
                    );
                }
            });
}

    /* ========================================
       BASIC HTML ESCAPING
    ======================================== */

    function escapeHTML(value) {

        return String(value || "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    /* ========================================
       START
    ======================================== */

    async function startProvider() {

        setStatus(
            "Connecting to ServiceHub...",
            false
        );


        await loadConversations();

        startRealtime();
    }


    startProvider();

</script>

</body>
</html>
