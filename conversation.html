<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ServiceHub — Provider</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #080b12;
            color: #f3f6fa;
            font-family: Arial, sans-serif;
        }

        .provider-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 18px 20px;
            background: #101522;
            border-bottom: 1px solid #20283a;
        }

        .header h1 {
            margin: 0;
            font-size: 20px;
        }

        .provider-name {
            margin-top: 5px;
            color: #8993a6;
            font-size: 13px;
        }

        .status {
            margin-top: 10px;
            font-size: 13px;
        }

        .status.connected {
            color: #48e28a;
        }

        .status.error {
            color: #ff6262;
        }

        .conversations {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
        }

        .empty {
            text-align: center;
            color: #8993a6;
            margin-top: 60px;
        }

        .conversation {
            background: #101522;
            border: 1px solid #20283a;
            border-radius: 14px;
            padding: 15px;
            margin-bottom: 12px;
        }

        .conversation-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .customer {
            font-weight: bold;
        }

        .service {
            color: #8993a6;
            font-size: 12px;
            margin-top: 3px;
        }

        .time {
            color: #687386;
            font-size: 11px;
        }

        .message {
            background: #151c2b;
            border-radius: 10px;
            padding: 10px;
            margin: 8px 0;
            font-size: 14px;
        }

        .message-name {
            color: #2388ff;
            font-size: 11px;
            margin-bottom: 4px;
        }

        .reply-box {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .reply-box input {
            flex: 1;
            min-width: 0;
            background: #080b12;
            border: 1px solid #30394d;
            border-radius: 9px;
            padding: 11px;
            color: white;
            outline: none;
        }

        .reply-box button {
            border: 0;
            border-radius: 9px;
            padding: 0 15px;
            background: #2388ff;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .reply-box button:active {
            transform: scale(.97);
        }
    </style>
</head>

<body>

<div class="provider-page">

    <header class="header">
        <h1>ServiceHub Provider</h1>

        <div class="provider-name">
            Signed in as: <strong>Solaceproeditz</strong>
        </div>

        <div id="status" class="status">
            Connecting...
        </div>
    </header>

  <main class="provider-layout">

    <!-- CHAT LIST -->
    <aside class="chat-list" id="chatList">

        <div class="chat-list-title">
            Chats
        </div>

        <div class="empty" id="emptyState">
            No conversations yet.
        </div>

    </aside>


    <!-- ACTIVE CHAT -->
    <section class="chat-window" id="chatWindow">

        <div class="chat-placeholder" id="chatPlaceholder">
            <div class="placeholder-icon">💬</div>
            <div>Select a conversation to start chatting</div>
        </div>

    </section>

</main>

</div>


<script>
(function(){
const chatList=document.getElementById("chatList"), chatWindow=document.getElementById("chatWindow"), statusElement=document.getElementById("status");
const PROVIDER_NAME=(JSON.parse(localStorage.getItem("serviceHubLogin")||"null")||{}).Name||"Service Provider";
function chats(){const out=[];for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(!key||!key.startsWith("serviceHubChat_"))continue;try{const c=JSON.parse(localStorage.getItem(key)||"null");if(c){c.storageKey=key;out.push(c);}}catch(_){}}return out;}
function setStatus(msg,ok){if(statusElement){statusElement.textContent=msg;statusElement.className=ok?"status connected":"status error";}}
function renderList(){chatList.innerHTML="";const title=document.createElement("div");title.className="chat-list-title";title.textContent="Chats";chatList.appendChild(title);const all=chats().sort((a,b)=>String(b.updatedAt||"").localeCompare(String(a.updatedAt||"")));if(!all.length){const e=document.createElement("div");e.className="empty";e.textContent="No conversations yet.";chatList.appendChild(e);return;}all.forEach(c=>{const item=document.createElement("div");item.className="chat-item";item.innerHTML='<div class="chat-item-header"><div class="chat-item-name"></div><div class="chat-item-time"></div></div><div class="chat-item-service"></div><div class="chat-item-preview"></div>';item.querySelector('.chat-item-name').textContent=c.customerName||"Customer";item.querySelector('.chat-item-time').textContent=c.updatedAt?new Date(c.updatedAt).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}):"";item.querySelector('.chat-item-service').textContent=c.serviceName||"";const ms=Array.isArray(c.messages)?c.messages:[];item.querySelector('.chat-item-preview').textContent=ms.length?ms[ms.length-1].message:"Open conversation";item.onclick=()=>openChat(c);chatList.appendChild(item);});}
function openChat(c){chatWindow.innerHTML="";const header=document.createElement("div");header.className="active-chat-header";const customer=document.createElement("div");customer.className="active-chat-customer";customer.textContent=c.customerName||"Customer";const service=document.createElement("div");service.className="active-chat-service";service.textContent=c.serviceName||"";header.appendChild(customer);header.appendChild(service);const msgs=document.createElement("div");msgs.className="active-messages";(c.messages||[]).forEach(m=>{const el=document.createElement("div");el.className="message "+(m.sender==="provider"?"provider-message":"customer-message");const n=document.createElement("div");n.className="message-name";n.textContent=m.sender==="provider"?PROVIDER_NAME:(c.customerName||"Customer");const body=document.createElement("div");body.textContent=m.message||"";el.appendChild(n);el.appendChild(body);msgs.appendChild(el);});const box=document.createElement("div");box.className="active-reply-box";const input=document.createElement("input");input.placeholder="Reply to customer...";const button=document.createElement("button");button.textContent="Send";function send(){const value=input.value.trim();if(!value)return;const stored=JSON.parse(localStorage.getItem(c.storageKey)||"null");if(!stored)return;stored.messages=Array.isArray(stored.messages)?stored.messages:[];stored.messages.push({sender:"provider",senderName:PROVIDER_NAME,message:value,createdAt:new Date().toISOString()});stored.updatedAt=new Date().toISOString();localStorage.setItem(c.storageKey,JSON.stringify(stored));input.value="";openChat(stored);renderList();window.dispatchEvent(new Event("serviceHubLocalChatUpdated"));}button.onclick=send;input.onkeydown=e=>{if(e.key==="Enter")send();};box.appendChild(input);box.appendChild(button);chatWindow.appendChild(header);chatWindow.appendChild(msgs);chatWindow.appendChild(box);}
window.addEventListener("storage",renderList);window.addEventListener("serviceHubLocalChatUpdated",renderList);setStatus("Local device chat",true);renderList();
})();
</script>
</body>
</html>
