<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Settings | ServiceHub</title>

    <link rel="stylesheet" href="style.css">
    <!-- ServiceHub app (PWA) -->
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#080b12">
    <meta name="application-name" content="ServiceHub">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="ServiceHub">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon-64.png">
    <script src="nav-guard.js"></script>
    <script src="bottom-nav.js"></script>
    <script src="/i18n.js" defer></script>
    <script src="/pwa.js" defer></script>
    <script src="page-intro.js" defer></script>
    <script src="/social-fab.js" defer></script>
    <script src="/support-desk.js" defer></script>
    <meta property="og:site_name" content="ServiceHub">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Settings | ServiceHub">
    <meta property="og:image" content="https://servicehub-amber.vercel.app/og-default.jpg">
    <link rel="stylesheet" href="development-notice.css">

    <style>
        .settings-page {
            max-width: 560px;
            margin: 0 auto;
            padding: 22px 18px 60px;
        }
        .settings-back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin: 0 0 18px;
            padding: 8px 12px 8px 8px;
            border: 0;
            border-radius: 10px;
            background: none;
            color: var(--muted);
            font: 600 14px Arial, sans-serif;
            cursor: pointer;
        }
        .settings-back:hover { color: var(--text); }
        .settings-page h1 {
            font-size: clamp(30px, 8vw, 38px);
            line-height: 1.15;
            letter-spacing: -.4px;
        }
        .settings-sub {
            margin: 8px 0 26px;
            color: var(--muted);
            font-size: 15px;
        }
        .settings-group-title {
            margin: 0 4px 10px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .12em;
            text-transform: uppercase;
        }
        .settings-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .settings-row {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 15px 16px;
            text-align: left;
            font: inherit;
            color: var(--text);
            cursor: pointer;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            -webkit-tap-highlight-color: transparent;
            transition: transform .15s ease, border-color .15s ease;
        }
        .settings-row:hover { border-color: rgba(35, 136, 255, .45); }
        .settings-row:active { transform: scale(.985); }
        .settings-row:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
        .settings-icon {
            flex: none;
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            background: linear-gradient(135deg, var(--blue), var(--purple));
        }
        .settings-icon svg { width: 22px; height: 22px; }
        .settings-text { flex: 1; min-width: 0; }
        .settings-text b { display: block; font-size: 16px; }
        .settings-text small {
            display: block;
            margin-top: 2px;
            color: var(--muted);
            font-size: 13.5px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .settings-chev { flex: none; color: var(--muted); }
        .settings-chev svg { width: 18px; height: 18px; display: block; }
        .settings-group-gap { margin-top: 26px; }
        .settings-text small.wrap { white-space: normal; overflow: visible; text-overflow: clip; line-height: 1.4; }
        .settings-switch {
            flex: none;
            position: relative;
            width: 48px;
            height: 28px;
            border-radius: 999px;
            background: rgba(255, 255, 255, .14);
            transition: background .2s ease;
        }
        .settings-switch i {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 2px 6px rgba(0, 0, 0, .4);
            transition: transform .22s cubic-bezier(.3, .7, .3, 1);
        }
        .settings-row[aria-checked="true"] .settings-switch { background: var(--blue); }
        .settings-row[aria-checked="true"] .settings-switch i { transform: translateX(20px); }
        .settings-note {
            margin: 22px 4px 0;
            color: var(--muted);
            font-size: 13.5px;
            text-align: center;
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <header class="navbar">
        <a href="index.html" class="logo">
            <span class="logo-mark">ϟ</span>
            <span>ServiceHub</span>
        </a>

        <div id="mobile-nav-panel" class="nav-panel">
            <nav class="nav-links">
                <a href="explore.html">Explore</a>
                <a href="manage.html">Manage Your Service</a>
                <a href="how-it-works.html">How It Works</a>
            </nav>

            <div class="nav-actions">
                <a class="login-btn" href="login.html">List a Job</a>
                <a class="list-btn" href="list-service.html">List Your Service</a>
            </div>
        </div>

        <button class="menu-btn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="mobile-nav-panel">☰</button>
    </header>

    <main class="settings-page">
        <button type="button" class="settings-back" onclick="if (history.length > 1) history.back(); else location.href = 'index.html';">← Back</button>

        <h1>Settings</h1>
        <p class="settings-sub">Personalise ServiceHub on this device.</p>

        <div class="settings-group-title">General</div>
        <div class="settings-list">

            <button type="button" class="settings-row" id="languageRow" aria-haspopup="dialog">
                <span class="settings-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg>
                </span>
                <span class="settings-text">
                    <b>Language</b>
                    <small id="languageValue" data-no-translate>Auto</small>
                </span>
                <span class="settings-chev" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
                </span>
            </button>

        </div>

        <div class="settings-group-title settings-group-gap">Navigation</div>
        <div class="settings-list">

            <button type="button" class="settings-row" id="barRow" role="switch" aria-checked="false">
                <span class="settings-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 15h18M8 18h.01M12 18h.01M16 18h.01"/></svg>
                </span>
                <span class="settings-text">
                    <b>Auto-hide bottom menu</b>
                    <small class="wrap" id="barValue">Off: the menu stays fixed at the bottom.</small>
                </span>
                <span class="settings-switch" aria-hidden="true"><i></i></span>
            </button>

        </div>

        <p class="settings-note">More settings are coming soon.</p>
    </main>

    <script src="script.js"></script>
    <script>
    (function () {
        var row = document.getElementById("languageRow");
        var value = document.getElementById("languageValue");

        function show() {
            var api = window.ServiceHubI18n;
            if (api && api.label) value.textContent = api.label();
        }

        row.addEventListener("click", function () {
            if (window.ServiceHubI18n) window.ServiceHubI18n.openPicker();
        });
        window.addEventListener("servicehub-lang", show);
        window.addEventListener("load", show);
        document.addEventListener("DOMContentLoaded", show);
        // i18n.js loads deferred, so check again shortly after the page is ready
        setTimeout(show, 300);

        /* ---- bottom menu: stay fixed, or hide while scrolling down ---- */
        var barRow = document.getElementById("barRow");
        var barValue = document.getElementById("barValue");
        var MODE_KEY = "serviceHubBottomBarMode";

        function readMode() {
            var api = window.serviceHubBottomBar;
            if (api && api.getMode) return api.getMode();
            try { return localStorage.getItem(MODE_KEY) === "auto" ? "auto" : "fixed"; } catch (_) { return "fixed"; }
        }
        function paintBar() {
            var auto = readMode() === "auto";
            barRow.setAttribute("aria-checked", auto ? "true" : "false");
            barValue.textContent = auto
                ? "On: hides when you scroll down and comes back when you scroll up."
                : "Off: the menu stays fixed at the bottom.";
        }
        barRow.addEventListener("click", function () {
            var next = readMode() === "auto" ? "fixed" : "auto";
            var api = window.serviceHubBottomBar;
            if (api && api.setMode) api.setMode(next);
            else { try { localStorage.setItem(MODE_KEY, next); } catch (_) {} }
            paintBar();
        });
        paintBar();
    })();
    </script>
    <script src="development-notice.js" defer></script>
</body>
</html>
