<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<title>Chat — ServiceHub</title>
<style>
:root{--bg:#080b12;--surface:#101522;--surface2:#151c2b;--blue:#2388ff;--text:#f3f6fa;--muted:#8993a5;--border:rgba(255,255,255,.08)}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;width:100%}html{-webkit-text-size-adjust:100%}body{position:fixed;inset:0;background:linear-gradient(rgba(3,7,18,.28),rgba(3,7,18,.28)),var(--bg) url("chat-bg.jpg") center center / cover fixed no-repeat;color:var(--text);font-family:Arial,Helvetica,sans-serif;overflow:hidden}.chat-page{height:100%;height:100dvh;height:var(--app-h,100dvh);width:100%;max-width:880px;margin:0 auto;background:transparent;display:flex;flex-direction:column;overflow:hidden;transform:translateY(var(--app-top,0px))}.chat-header{min-height:calc(58px + env(safe-area-inset-top,0px));flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 18px;padding-top:env(safe-area-inset-top,0px);position:relative}.avatar{width:35px;height:35px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#2388ff,#a855f7,#ff4fd8);font-weight:700;margin-right:10px}.provider-info h1{font-size:14px}.provider-info p{font-size:10px;color:var(--muted);margin-top:2px}.edit-name{position:absolute;right:8px;top:7px;border:0;background:none;color:var(--muted);font-size:13px;cursor:pointer;opacity:.7}.messages{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:20px 16px;display:flex;flex-direction:column;gap:9px}.empty{margin:auto;text-align:center;color:var(--muted);font-size:12px;line-height:1.5}.empty strong{display:block;color:var(--text);font-size:16px;margin-bottom:5px}.bubble{max-width:min(75%,650px);overflow-wrap:anywhere;word-break:break-word;padding:9px 12px;border-radius:13px;font-size:13px;line-height:1.45}.bubble.user{align-self:flex-end;background:var(--blue);border-bottom-right-radius:4px}.bubble.provider{align-self:flex-start;background:var(--surface2);border:1px solid var(--border);border-bottom-left-radius:4px}.time{display:block;font-size:8px;opacity:.55;margin-top:4px}.composer-area{background:var(--surface);border-top:1px solid var(--border);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));flex:0 0 auto}.composer{display:flex;gap:8px;align-items:center}.composer input{flex:1;min-width:0;height:42px;border-radius:21px;border:1px solid var(--border);background:var(--surface2);color:var(--text);outline:none;padding:0 13px;font-size:13px}.composer input:focus{border-color:rgba(35,136,255,.55)}.send{width:38px;height:38px;border:0;border-radius:50%;background:var(--blue);color:#fff;cursor:pointer;font-size:17px}.as{font-size:9px;color:var(--muted);padding:3px 13px;opacity:.7}.as.err{color:#fca5a5;opacity:1}.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.72);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;padding:20px}.modal.active{display:flex}.modal-box{width:min(400px,100%);background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px}.modal-box h2{font-size:18px;margin-bottom:7px}.modal-box p{font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:17px}.modal-box input{width:100%;height:42px;border:1px solid var(--border);border-radius:9px;background:var(--surface2);color:var(--text);outline:none;padding:0 12px;font-size:13px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.actions button{height:36px;padding:0 15px;border:1px solid var(--border);border-radius:8px;background:none;color:var(--text);cursor:pointer;font-size:12px}.actions .primary{border:0;background:var(--blue)}@media(max-width:600px){.chat-header{height:54px;min-height:54px;padding:0 12px}.messages{padding:15px 11px}.bubble{max-width:82%;font-size:12px}.composer-area{padding:7px 8px 3px}.composer input{font-size:12px;height:40px}.send{width:36px;height:36px}.composer input{font-size:16px}}
/* phones on their side: short screens, keep the header slim so the text box always has room */
@media(max-height:480px){.chat-header{min-height:calc(44px + env(safe-area-inset-top,0px))}.avatar{width:30px;height:30px}.messages{padding:10px 12px}.composer-area{padding:5px 10px calc(5px + env(safe-area-inset-bottom,0px))}.composer input{height:36px}.send{width:34px;height:34px}.as{padding:1px 13px}}
/* tablets and laptops: centred column with soft edges */
@media(min-width:900px){.chat-page{border-left:1px solid var(--border);border-right:1px solid var(--border);background:rgba(8,11,18,.35)}.bubble{font-size:14px}.composer input{font-size:14px;height:46px}.send{width:42px;height:42px}}
@media(min-width:1400px){.chat-page{max-width:980px}}
</style>
<script src="/link-guard.js"></script>
<script src="backend-config.js"></script>
    <!-- ServiceHub app (PWA) -->
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#080b12">
    <meta name="application-name" content="ServiceHub">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="ServiceHub">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon-64.png">
    <script>window.SERVICEHUB_I18N_BOTTOM=84;</script>
    <script src="/i18n.js" defer></script>
    <script src="/pwa.js" defer></script>
    <!-- ServiceHub link preview -->
    <meta property="og:site_name" content="ServiceHub">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Chat — ServiceHub">
    <meta property="og:description" content="Discover skilled people, businesses and professionals offering the services you need.">
    <meta property="og:image" content="https://servicehub-amber.vercel.app/og-default.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Chat — ServiceHub">
    <meta name="twitter:description" content="Discover skilled people, businesses and professionals offering the services you need.">
    <meta name="twitter:image" content="https://servicehub-amber.vercel.app/og-default.jpg">
    <link rel="stylesheet" href="development-notice.css">
</head>
<body>
<main class="chat-page">
<header class="chat-header"><div class="avatar">S</div><div class="provider-info"><h1 id="providerName">Service Provider</h1><p id="serviceName">ServiceHub provider</p></div><button class="edit-name" id="editName" type="button" aria-label="Edit name">✎</button></header>
<section class="messages" id="messages"><div class="empty" id="empty"><strong>Start a conversation</strong>Send a message to the provider about this service.</div></section>
<div class="composer-area"><div class="composer"><input id="messageInput" data-link-policy="all" maxlength="2000" autocomplete="off" placeholder="Type a message..."><button class="send" id="sendMessage" type="button" aria-label="Send">➤</button></div><div class="as" id="chattingAs"></div></div>
</main>
<div class="modal" id="nameModal"><div class="modal-box"><h2>Your name</h2><p>Enter the name you want the provider to see when you chat.</p><form id="nameForm"><input id="nameInput" maxlength="80" autocomplete="name" placeholder="Enter your name" required><div class="actions"><button type="button" id="cancelName">Cancel</button><button class="primary" type="submit">Continue</button></div></form></div></div>
<script>
(function(){
const NAME_KEY="customerName", TOKEN_KEY="serviceHubClientToken";
/* Keep the page exactly as tall as what the person can actually see, so the text box is never pushed off screen. */
var root=document.documentElement, vv=window.visualViewport;
function fit(){
  var h=vv?vv.height:window.innerHeight, top=vv?vv.offsetTop:0;
  root.style.setProperty("--app-h",Math.round(h)+"px");
  root.style.setProperty("--app-top",Math.round(top)+"px");
  if(window.scrollY)window.scrollTo(0,0);
}
fit();
if(vv){vv.addEventListener("resize",function(){fit();var m=document.getElementById("messages");if(m)m.scrollTop=m.scrollHeight;});vv.addEventListener("scroll",fit);}
window.addEventListener("resize",fit);window.addEventListener("orientationchange",function(){setTimeout(fit,250);});
const params=new URLSearchParams(location.search);
const messages=document.getElementById("messages"), empty=document.getElementById("empty"), input=document.getElementById("messageInput"), send=document.getElementById("sendMessage");
const nameModal=document.getElementById("nameModal"), nameForm=document.getElementById("nameForm"), nameInput=document.getElementById("nameInput"), chattingAs=document.getElementById("chattingAs");
const providerNameEl=document.getElementById("providerName"), serviceNameEl=document.getElementById("serviceName");
let token=localStorage.getItem(TOKEN_KEY); if(!token){ token=(crypto.randomUUID?crypto.randomUUID():"sh-"+Date.now()+"-"+Math.random().toString(36).slice(2)); localStorage.setItem(TOKEN_KEY,token); }
const cards=JSON.parse(localStorage.getItem("serviceHubBackendCards")||"{}");
const listingId=(params.get("listing")||params.get("service")||"").trim();
const serviceId=listingId;
const card=cards[listingId]||{};
let providerId=String(card.providerId||card["Provider ID"]||"");
let providerName=String(card.provider||card.providerName||"");
let serviceName=String(card.title||card.serviceName||"");
providerNameEl.textContent=providerName||"Loading..."; serviceNameEl.textContent=serviceName;
if(!listingId){empty.innerHTML="<strong>Listing not found</strong>Go back and tap Contact provider again.";input.disabled=true;send.disabled=true;providerNameEl.textContent="Service provider";}
function loadListing(){
  var base=String(window.SERVICEHUB_APPS_SCRIPT_URL||"").replace(/\/$/,"");
  if(!listingId||!base)return;
  fetch(base+"?action=getListing&listingId="+encodeURIComponent(listingId)+"&_="+Date.now(),{cache:"no-store"})
  .then(function(r){return r.json()}).then(function(d){
    var l=d&&d.listing;if(!l)return;
    providerId=String(l.providerId||l["Provider ID"]||providerId);
    providerName=String(l.company||l["Company"]||l.providerName||l["Provider Name"]||providerName);
    serviceName=String(l.serviceName||l["Service Name"]||serviceName);
    providerNameEl.textContent=providerName||"Service provider";serviceNameEl.textContent=serviceName;
    var a=document.querySelector(".avatar");if(a&&providerName)a.textContent=providerName.charAt(0).toUpperCase();
  }).catch(function(){});
}
function getName(){return (localStorage.getItem(NAME_KEY)||"").trim();}
function updateName(){chattingAs.classList.remove("err");chattingAs.textContent=getName()?"chatting as "+getName():"";}
function flash(msg){chattingAs.classList.add("err");chattingAs.textContent=msg;setTimeout(updateName,2600);}
function openModal(){nameInput.value=getName();nameModal.classList.add("active");setTimeout(function(){nameInput.focus();nameInput.select();},50);}
function closeModal(){nameModal.classList.remove("active");}
document.getElementById("editName").onclick=openModal; document.getElementById("cancelName").onclick=closeModal;
nameForm.addEventListener("submit",function(e){e.preventDefault();const n=nameInput.value.trim();if(!n)return;localStorage.setItem(NAME_KEY,n);updateName();closeModal();});

/* ---- Supabase: every message is scoped to this exact listingId, so two
   providers' chats can never mix, even if a customer messages several
   providers from the same browser. ---- */
function sb(fn,params){
  var url=String(window.SERVICEHUB_SUPABASE_URL||"").replace(/\/$/,"");
  var key=String(window.SERVICEHUB_SUPABASE_ANON_KEY||"");
  if(!url||!key)return Promise.reject(new Error("Chat isn't set up yet."));
  return fetch(url+"/rest/v1/rpc/"+fn,{method:"POST",headers:{"Content-Type":"application/json","apikey":key,"Authorization":"Bearer "+key},body:JSON.stringify(params||{})})
    .then(function(r){return r.text().then(function(t){var data=t?JSON.parse(t):null;if(!r.ok){throw new Error((data&&data.message)||"Chat request failed.");}return data;});});
}
var lastId=0, sending=false;
function renderRows(rows){
  if(!rows||!rows.length){if(!messages.querySelector(".bubble"))messages.innerHTML='<div class="empty"><strong>Start a conversation</strong>Send a message to the provider about this service.</div>';return;}
  var atBottom=messages.scrollHeight-messages.scrollTop-messages.clientHeight<40;
  if(!messages.querySelector(".bubble"))messages.innerHTML="";
  rows.forEach(function(m){
    if(m.id<=lastId)return;
    lastId=m.id;
    var b=document.createElement("div");b.className="bubble "+(m.sender==="customer"?"user":"provider");
    var txt=document.createElement("span");txt.className="msg-text";var LGd=window.ServiceHubLinkGuard,flagged=false;
    /* unsupported links stay visible but unclickable, with a "might be dangerous" note */
    if(LGd&&LGd.renderInto){flagged=LGd.renderInto(txt,m.body||"","all");}else{txt.textContent=m.body||"";}
    if(m.sender!=="customer"&&!flagged)txt.setAttribute("data-chat-in","");   /* incoming: i18n.js translates it for the reader */
    b.appendChild(txt);
    var time=document.createElement("span");time.className="time";time.textContent=m.created_at?new Date(m.created_at).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}):"";
    b.appendChild(time);messages.appendChild(b);
  });
  if(atBottom)messages.scrollTop=messages.scrollHeight;
}
function pull(){if(!listingId)return;sb("customer_messages",{p_listing:listingId,p_client:token,p_after:lastId}).then(renderRows).catch(function(){});}
function submit(){
  if(window.ServiceHubLinkGuard&&!window.ServiceHubLinkGuard.checkField(input))return;
  var value=input.value.trim();if(!value||sending||!listingId)return;
  sending=true;send.disabled=true;
  sb("customer_send",{p_listing:listingId,p_client:token,p_name:getName()||"Customer",p_body:value})
    .then(function(){input.value="";return pull();})
    .catch(function(e){flash(e.message||"Message failed - try again");})
    .then(function(){sending=false;send.disabled=false;});
}
input.addEventListener("focus",function(){setTimeout(function(){fit();messages.scrollTop=messages.scrollHeight;},300);});
send.onclick=submit;input.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();submit();}});
updateName();loadListing();
if(listingId){pull();setInterval(function(){if(!document.hidden)pull();},4000);}
if(!getName())setTimeout(openModal,120);
})();
</script>
    <script src="development-notice.js" defer></script>
</body>
</html>
